<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conakry Tech Tools</title>
<style>
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#0b1120;color:#f8fafc}
h1{color:#5eead4}
.card{background:#172033;padding:18px;margin:16px 0;border-radius:14px}
label{display:block;margin:12px 0 5px}
input,button{padding:12px;border-radius:8px;font-size:16px}
input{width:90%;max-width:320px}
button{background:#5eead4;color:#0b1120;border:0;font-weight:bold;margin-top:14px}
.result{color:#5eead4;font-weight:bold}
</style>
</head>
<body>
<h1>Conakry Tech Tools</h1>
<p>Des outils numériques pour apprendre et progresser.</p>

<div class="card">
<h2>Calculateur de moyenne</h2>
<p>Entre deux notes sur 20 et leurs coefficients.</p>

<label for="n1">Première note sur 20</label>
<input id="n1" type="number" min="0" max="20" step="0.25" placeholder="Ex. 14">

<label for="c1">Premier coefficient</label>
<input id="c1" type="number" min="0.01" step="0.01" value="1">

<label for="n2">Deuxième note sur 20</label>
<input id="n2" type="number" min="0" max="20" step="0.25" placeholder="Ex. 12">

<label for="c2">Deuxième coefficient</label>
<input id="c2" type="number" min="0.01" step="0.01" value="1">

<button onclick="calculer()">Calculer ma moyenne</button>
<p id="resultat" class="result"></p>
</div>

<div class="card">
<h2>Quiz scolaire</h2>
<p>Bientôt disponible !</p>
</div>

<div class="card">
<h2>Planificateur de révisions</h2>
<p>Bientôt disponible !</p>
</div>

<div class="card">
<h2>Outils pour entreprises</h2>
<p>Bientôt disponible !</p>
</div>

<script>
function calculer(){
const n1=document.getElementById('n1').value;
const n2=document.getElementById('n2').value;
const c1=Number(document.getElementById('c1').value);
const c2=Number(document.getElementById('c2').value);
const r=document.getElementById('resultat');

if(n1===''||n2===''||c1<=0||c2<=0||
Number(n1)<0||Number(n1)>20||
Number(n2)<0||Number(n2)>20||
!Number.isFinite(c1)||!Number.isFinite(c2)){
r.textContent='Vérifie les notes et les coefficients.';
return;
}
const m=(Number(n1)*c1+Number(n2)*c2)/(c1+c2);
r.textContent='Ta moyenne est : '+m.toLocaleString('fr-FR',
{minimumFractionDigits:2,maximumFractionDigits:2})+' / 20';
}
</script>
</body>
</html>
